[project]
name = "soccer-analyst"
version = "0.1.0"
description = "Local soccer tactical analysis tool — formations, heatmaps, pressing intensity"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30.0",
    "opencv-python>=4.8.0",
    "ffmpeg-python>=0.2.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
]

[project.scripts]
soccer-analyst = "ui.app:main"
