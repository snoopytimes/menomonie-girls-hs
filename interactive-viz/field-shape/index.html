<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Shape — Menomonie Mustangs</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1 id="page-title">Field Shape</h1>
<p class="subtitle" id="page-subtitle"></p>

<!-- Formation & Phase selectors (hidden if only one option) -->
<div class="formation-selector" id="formation-selector"></div>
<div class="phase-selector" id="phase-selector"></div>

<button class="controls-toggle" id="controls-toggle" onclick="toggleControls()">▾ Controls</button>

<div class="controls-wrap" id="controls-wrap">
  <div class="unit-selector" id="unit-selector"></div>

  <div class="selector-group">
    <span class="selector-label">Zone</span>
    <div class="tabs" id="zone-tabs"></div>
  </div>
  <div class="selector-group">
    <span class="selector-label">Lane</span>
    <div class="tabs" id="lane-tabs"></div>
  </div>

  <div class="overlay-toggles">
    <label class="lane-toggle">
      <input type="checkbox" onchange="toggleOverlay('lane-overlay', this.checked)">
      <span class="lane-toggle-track"></span>
      Field Lanes
    </label>
    <label class="lane-toggle">
      <input type="checkbox" onchange="toggleOverlay('zone-overlay', this.checked)">
      <span class="lane-toggle-track"></span>
      Field Zones
    </label>
    <button class="reset-btn" onclick="resetToDefault()">↺ Reset</button>
  </div>
</div>

<div class="field-wrap">
<svg class="field" viewBox="0 0 300 420" xmlns="http://www.w3.org/2000/svg">

  <!-- Stripes -->
  <rect width="300" height="420" fill="#2d5a1b"/>
  <rect x="0" y="0"   width="300" height="35" fill="#2a5519" opacity=".5"/>
  <rect x="0" y="70"  width="300" height="35" fill="#2a5519" opacity=".5"/>
  <rect x="0" y="140" width="300" height="35" fill="#2a5519" opacity=".5"/>
  <rect x="0" y="210" width="300" height="35" fill="#2a5519" opacity=".5"/>
  <rect x="0" y="280" width="300" height="35" fill="#2a5519" opacity=".5"/>
  <rect x="0" y="350" width="300" height="35" fill="#2a5519" opacity=".5"/>

  <!-- Lane overlay -->
  <g id="lane-overlay" display="none">
    <rect x="10"  y="10" width="56" height="400" fill="rgba(100,160,255,.13)"/>
    <line x1="66"  y1="10" x2="66"  y2="410" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="38"  y="24" text-anchor="middle" font-family="Bebas Neue,sans-serif" font-size="7.5" fill="rgba(255,255,255,.45)" letter-spacing=".05em">Wide L</text>
    <rect x="66"  y="10" width="56" height="400" fill="rgba(200,168,75,.10)"/>
    <line x1="122" y1="10" x2="122" y2="410" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="94"  y="24" text-anchor="middle" font-family="Bebas Neue,sans-serif" font-size="7.5" fill="rgba(200,168,75,.6)" letter-spacing=".05em">L Half</text>
    <rect x="122" y="10" width="56" height="400" fill="rgba(255,255,255,.05)"/>
    <line x1="178" y1="10" x2="178" y2="410" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="150" y="24" text-anchor="middle" font-family="Bebas Neue,sans-serif" font-size="7.5" fill="rgba(255,255,255,.45)" letter-spacing=".05em">Central</text>
    <rect x="178" y="10" width="56" height="400" fill="rgba(200,168,75,.10)"/>
    <line x1="234" y1="10" x2="234" y2="410" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="206" y="24" text-anchor="middle" font-family="Bebas Neue,sans-serif" font-size="7.5" fill="rgba(200,168,75,.6)" letter-spacing=".05em">R Half</text>
    <rect x="234" y="10" width="56" height="400" fill="rgba(100,160,255,.13)"/>
    <text x="262" y="24" text-anchor="middle" font-family="Bebas Neue,sans-serif" font-size="7.5" fill="rgba(255,255,255,.45)" letter-spacing=".05em">Wide R</text>
  </g>

  <!-- Zone overlay -->
  <g id="zone-overlay" display="none">
    <rect x="10" y="10"  width="280" height="133" fill="rgba(200,168,75,.10)"/>
    <rect x="10" y="143" width="280" height="134" fill="rgba(255,255,255,.04)"/>
    <rect x="10" y="277" width="280" height="133" fill="rgba(143,26,26,.12)"/>
    <line x1="10" y1="143" x2="290" y2="143" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="6 4"/>
    <line x1="10" y1="277" x2="290" y2="277" stroke="rgba(255,255,255,.35)" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="18" y="128" font-family="Bebas Neue,sans-serif" font-size="8" fill="rgba(200,168,75,.7)"  letter-spacing=".08em">Attacking</text>
    <text x="18" y="270" font-family="Bebas Neue,sans-serif" font-size="8" fill="rgba(255,255,255,.4)" letter-spacing=".08em">Midfield</text>
    <text x="18" y="405" font-family="Bebas Neue,sans-serif" font-size="8" fill="rgba(200,80,80,.7)"   letter-spacing=".08em">Defensive</text>
  </g>

  <!-- Pitch markings -->
  <rect x="10" y="10" width="280" height="400" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
  <line x1="10" y1="210" x2="290" y2="210" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
  <circle cx="150" cy="210" r="40" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
  <circle cx="150" cy="210" r="2" fill="rgba(255,255,255,.4)"/>
  <rect x="72" y="10" width="156" height="55" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
  <rect x="114" y="10" width="72" height="22" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
  <circle cx="150" cy="47" r="1.5" fill="rgba(255,255,255,.4)"/>
  <rect x="126" y="6" width="48" height="8" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>
  <rect x="72" y="355" width="156" height="55" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
  <rect x="114" y="388" width="72" height="22" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
  <circle cx="150" cy="373" r="1.5" fill="rgba(255,255,255,.4)"/>
  <rect x="126" y="406" width="48" height="8" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>

  <defs>
    <marker id="arrow-gold" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c8a84b"/>
    </marker>
  </defs>

  <!-- Dynamic layer: compress zones, shape lines, press arrows, players are injected here -->
  <g id="dynamic-layer"></g>

  <!-- Ball + attacker (always present) -->
  <circle id="att-ring" cx="150" cy="80" r="14" fill="none" stroke="#e05c5c" stroke-width="1.5" stroke-dasharray="3 2" opacity=".6"/>
  <circle id="ball"       cx="150" cy="80" r="7"   fill="#f5f0e0" stroke="#c8a84b" stroke-width="2" class="draggable" data-drag="ball"/>
  <circle id="ball-inner" cx="150" cy="80" r="2.5" fill="#c8a84b" opacity=".7"/>
  <circle id="att"    cx="150" cy="80" r="10" fill="rgba(224,92,92,.85)" stroke="rgba(255,255,255,.7)" stroke-width="1.5" class="draggable" data-drag="ball"/>
  <text id="att-lbl" x="150" y="83.5" text-anchor="middle" font-family="DM Sans,sans-serif" font-size="7.5" font-weight="700" fill="white">ATT</text>

</svg>
</div>

<div class="legend" id="legend"></div>
<div class="desc-box" id="desc-box"></div>

<script src="formations.js"></script>
<script src="app.js"></script>
</body>
</html>
