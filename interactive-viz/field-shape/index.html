<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Field Shape — Menomonie Mustangs 4-3-3</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f0f; color: #f0ede6; font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 40px; }
  h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(1.6rem,4vw,2.4rem); letter-spacing: .08em; color: #c8a84b; margin-bottom: 4px; }
  .subtitle { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; color: #666; margin-bottom: 20px; }

  /* Unit toggles */
  .unit-selector { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .unit-btn { background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; font-family: 'Bebas Neue', sans-serif; font-size: 1rem; letter-spacing: .12em; padding: 8px 20px; border-radius: 3px; cursor: pointer; transition: all .15s; }
  .unit-btn:hover { border-color: #8f1a1a; color: #c8a84b; }
  .unit-btn.active { background: #8f1a1a; border-color: #8f1a1a; color: #f0ede6; }

  /* Zone + Lane selectors */
  .selector-group { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; width: 100%; max-width: 480px; }
  .selector-label { font-family: 'Bebas Neue', sans-serif; font-size: .82rem; letter-spacing: .1em; color: #555; white-space: nowrap; width: 42px; text-align: right; flex-shrink: 0; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { background: #1a1a1a; border: 1px solid #2a2a2a; color: #888; font-family: 'DM Sans', sans-serif; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; padding: 7px 14px; border-radius: 3px; cursor: pointer; transition: all .18s; }
  .tab:hover { border-color: #c8a84b; color: #c8a84b; }
  .tab.active { background: #c8a84b; border-color: #c8a84b; color: #0f0f0f; }

  /* Overlay toggles */
  .overlay-toggles { display: flex; gap: 20px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .lane-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: .72rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #666; transition: color .15s; }
  .lane-toggle:hover { color: #c8a84b; }
  .lane-toggle input { display: none; }
  .lane-toggle-track { width: 32px; height: 16px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 8px; position: relative; transition: background .2s, border-color .2s; flex-shrink: 0; }
  .lane-toggle-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #555; transition: transform .2s, background .2s; }
  .lane-toggle input:checked + .lane-toggle-track { background: #c8a84b22; border-color: #c8a84b; }
  .lane-toggle input:checked + .lane-toggle-track::after { transform: translateX(16px); background: #c8a84b; }

  .field-wrap { position: relative; width: 100%; max-width: 480px; }
  svg.field { width: 100%; height: auto; display: block; border-radius: 4px; filter: drop-shadow(0 8px 32px rgba(0,0,0,.6)); touch-action: none; user-select: none; }
  svg.field text { pointer-events: none; user-select: none; }
  .draggable { cursor: grab; }
  .draggable:active { cursor: grabbing; }

  .legend { display: flex; gap: 14px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: .72rem; color: #888; letter-spacing: .06em; }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }

  .desc-box { max-width: 480px; width: 100%; margin-top: 16px; background: #161616; border: 1px solid #252525; border-left: 3px solid #c8a84b; border-radius: 3px; padding: 14px 16px; }
  .desc-unit + .desc-unit { margin-top: 10px; padding-top: 10px; border-top: 1px solid #222; }
  .desc-unit h3 { font-family: 'Bebas Neue', sans-serif; font-size: .9rem; letter-spacing: .1em; color: #c8a84b; margin-bottom: 4px; }
  .desc-unit p { font-size: .78rem; line-height: 1.65; color: #aaa; }
  .desc-unit p strong { color: #f0ede6; }
</style>
</head>
<body>

<h1>Pressing &amp; Defensive Shape</h1>
<p class="subtitle">Menomonie Mustangs · 4-3-3 · Sweeper / Libero System</p>

<div class="unit-selector">
  <button class="unit-btn active" onclick="toggleUnit('defense')">Defense</button>
  <button class="unit-btn active" onclick="toggleUnit('midfield')">Midfield</button>
  <button class="unit-btn active" onclick="toggleUnit('forwards')">Forwards</button>
</div>

<div class="selector-group">
  <span class="selector-label">Zone</span>
  <div class="tabs" id="zone-tabs">
    <button class="tab" onclick="setZone('attacking')">Attacking</button>
    <button class="tab" onclick="setZone('midfield')">Midfield</button>
    <button class="tab active" onclick="setZone('defensive')">Defensive</button>
  </div>
</div>
<div class="selector-group">
  <span class="selector-label">Lane</span>
  <div class="tabs" id="lane-tabs">
    <button class="tab" onclick="setBall('left')">Wide Left</button>
    <button class="tab" onclick="setBall('left-center')">Left Central</button>
    <button class="tab" onclick="setBall('center')">Central</button>
    <button class="tab" onclick="setBall('right-center')">Right Central</button>
    <button class="tab active" onclick="setBall('right')">Wide Right</button>
  </div>
</div>

<div class="overlay-toggles">
  <label class="lane-toggle">
    <input type="checkbox" onchange="toggleOverlay('lane-overlay', this.checked)">
    <span class="lane-toggle-track"></span>
    Field Lanes
  </label>
  <label class="lane-toggle">
    <input type="checkbox" onchange="toggleOverlay('zone-overlay', this.checked)">
    <span class="lane-toggle-track"></span>
    Field Zones
  </label>
</div>

// ── STATE ──────────────────────────────────────
let activeUnits = new Set(['defense', 'midfield', 'forwards']);

let animFrame   = null;
let startTime   = null;
let livePos     = null;
const DUR = 380;

// ── HELPERS ────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function setEl(id, attr, val) { const e = document.getElementById(id); if (e) e.setAttribute(attr, val); }

function getFullPos(zone, ball) {
  const d = DEF_POS[zone][ball], m = MID_POS[zone][ball], f = FWD_POS[zone][ball];
  return {
    ball:{...BALL_POS[zone][ball]},
    dA:{...d.dA},dB:{...d.dB},dC:{...d.dC},dD:{...d.dD},
    mA:{...m.mA},mB:{...m.mB},mC:{...m.mC},
    fA:{...f.fA},fB:{...f.fB},fC:{...f.fC}
  };
}

function setPlayer(k, p) {
  setEl(k+'-shadow','cx',p.x+1); setEl(k+'-shadow','cy',p.y+1);
  setEl(k,'cx',p.x); setEl(k,'cy',p.y);
  setEl(k+'-lbl','x',p.x); setEl(k+'-lbl','y',p.y+3.5);
}

function drawArrow(id, from, to) {
  const dx=to.x-from.x, dy=to.y-from.y, d=Math.sqrt(dx*dx+dy*dy);
  if (d > 22) {
    setEl(id,'x1',from.x+dx*14/d); setEl(id,'y1',from.y+dy*14/d);
    setEl(id,'x2',from.x+dx*(d-16)/d); setEl(id,'y2',from.y+dy*(d-16)/d);
  } else { setEl(id,'x1',0);setEl(id,'y1',0);setEl(id,'x2',0);setEl(id,'y2',0); }
}
function clearArrow(id) { setEl(id,'x1',0);setEl(id,'y1',0);setEl(id,'x2',0);setEl(id,'y2',0); }

// ── APPLY POSITIONS ────────────────────────────
function applyPos(pos) {
  livePos = JSON.parse(JSON.stringify(pos));
  const b = pos.ball;
  ['ball','ball-inner','att-ring'].forEach(id=>{setEl(id,'cx',b.x);setEl(id,'cy',b.y);});
  setEl('att','cx',b.x);setEl('att','cy',b.y);setEl('att-lbl','x',b.x);setEl('att-lbl','y',b.y+3.5);

  ['dA','dB','dC','dD','mA','mB','mC','fA','fB','fC'].forEach(k=>setPlayer(k,pos[k]));

  const defOn=activeUnits.has('defense'), midOn=activeUnits.has('midfield'), fwdOn=activeUnits.has('forwards');
  ['grp-dA','grp-dB','grp-dC','grp-dD'].forEach(id=>document.getElementById(id).style.display=defOn?'':'none');
  ['grp-mA','grp-mB','grp-mC'].forEach(id=>document.getElementById(id).style.display=midOn?'':'none');
  ['grp-fA','grp-fB','grp-fC'].forEach(id=>document.getElementById(id).style.display=fwdOn?'':'none');
  document.getElementById('def-lines').style.display=defOn?'':'none';
  document.getElementById('mid-lines').style.display=midOn?'':'none';
  document.getElementById('fwd-lines').style.display=fwdOn?'':'none';

  if (defOn) {
    const {dA,dB,dC,dD}=pos;
    setEl('dl-1','x1',dA.x);setEl('dl-1','y1',dA.y);setEl('dl-1','x2',dB.x);setEl('dl-1','y2',dB.y);
    setEl('dl-2','x1',dB.x);setEl('dl-2','y1',dB.y);setEl('dl-2','x2',dC.x);setEl('dl-2','y2',dC.y);
    setEl('dl-3','x1',dA.x);setEl('dl-3','y1',dA.y);setEl('dl-3','x2',dD.x);setEl('dl-3','y2',dD.y);
    setEl('dl-4','x1',dC.x);setEl('dl-4','y1',dC.y);setEl('dl-4','x2',dD.x);setEl('dl-4','y2',dD.y);
    setEl('dl-5','x1',dB.x);setEl('dl-5','y1',dB.y);setEl('dl-5','x2',dD.x);setEl('dl-5','y2',dD.y);
  }
  if (midOn) {
    const {mA,mB,mC}=pos;
    setEl('ml-1','x1',mA.x);setEl('ml-1','y1',mA.y);setEl('ml-1','x2',mB.x);setEl('ml-1','y2',mB.y);
    setEl('ml-2','x1',mB.x);setEl('ml-2','y1',mB.y);setEl('ml-2','x2',mC.x);setEl('ml-2','y2',mC.y);
  }
  if (fwdOn) {
    const {fA,fB,fC}=pos;
    setEl('fl-1','x1',fA.x);setEl('fl-1','y1',fA.y);setEl('fl-1','x2',fB.x);setEl('fl-1','y2',fB.y);
    setEl('fl-2','x1',fB.x);setEl('fl-2','y1',fB.y);setEl('fl-2','x2',fC.x);setEl('fl-2','y2',fC.y);
  }

  if (defOn) drawArrow('press-d', pos[DEF_POS[currentZone][currentBall].pressFrom], b); else clearArrow('press-d');
  if (midOn) drawArrow('press-m', pos[MID_POS[currentZone][currentBall].pressFrom], b); else clearArrow('press-m');
  if (fwdOn) drawArrow('press-f', pos[FWD_POS[currentZone][currentBall].pressFrom], b); else clearArrow('press-f');
}

// ── LEGEND & DESCRIPTION ───────────────────────
function renderLegend() {
  const items=[];
  if(activeUnits.has('defense'))  items.push(...LEGEND_ITEMS.defense);
  if(activeUnits.has('midfield')) items.push(...LEGEND_ITEMS.midfield);
  if(activeUnits.has('forwards')) items.push(...LEGEND_ITEMS.forwards);
  items.push(...LEGEND_ITEMS.shared);
  document.getElementById('legend').innerHTML=items.map(i=>`<div class="legend-item"><div class="legend-dot" style="background:${i.color};border:${i.border}"></div>${i.label}</div>`).join('');
}

function updateDescription() {
  const order=['forwards','midfield','defense'];
  const active=order.filter(u=>activeUnits.has(u));
  document.getElementById('desc-box').innerHTML=active.length===0
    ?'<div class="desc-unit"><p style="color:#555">Select a unit above.</p></div>'
    :active.map(u=>`<div class="desc-unit"><h3>${u.charAt(0).toUpperCase()+u.slice(1)}</h3><p>${DESCRIPTIONS[u][currentZone][currentBall]}</p></div>`).join('');
}

// ── ANIMATE ────────────────────────────────────
function animateTo(zone, ball) {
  if (animFrame) cancelAnimationFrame(animFrame);
  const from = livePos || getFullPos(currentZone, currentBall);
  const to   = getFullPos(zone, ball);
  startTime  = performance.now();
  function step(now) {
    const t=Math.min((now-startTime)/DUR,1), e=t<.5?2*t*t:-1+(4-2*t)*t;
    const pos={};
    ['ball','dA','dB','dC','dD','mA','mB','mC','fA','fB','fC'].forEach(k=>{
      pos[k]={x:lerp(from[k].x,to[k].x,e),y:lerp(from[k].y,to[k].y,e)};
    });
    applyPos(pos);
    if(t<1) animFrame=requestAnimationFrame(step);
    else { applyPos(to); animFrame=null; }
  }
  animFrame=requestAnimationFrame(step);
}

// ── PUBLIC SETTERS ─────────────────────────────
function toggleUnit(unit) {
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  activeUnits.has(unit)?activeUnits.delete(unit):activeUnits.add(unit);
  document.querySelectorAll('.unit-btn').forEach(btn=>{
    btn.classList.toggle('active',activeUnits.has(btn.textContent.toLowerCase().trim()));
  });
  applyPos(livePos||getFullPos(currentZone,currentBall));
  renderLegend(); updateDescription();
}

function setZone(zone) {
  document.querySelectorAll('#zone-tabs .tab').forEach((t,i)=>{
    t.classList.toggle('active',['attacking','midfield','defensive'][i]===zone);
  });
  currentZone=zone; updateDescription(); animateTo(zone,currentBall);
}

function setBall(ball) {
  document.querySelectorAll('#lane-tabs .tab').forEach((t,i)=>{
    t.classList.toggle('active',['left','left-center','center','right-center','right'][i]===ball);
  });
  currentBall=ball; updateDescription(); animateTo(currentZone,ball);
}

// ── DRAG ───────────────────────────────────────
let dragKey=null, dragOffset={x:0,y:0};
function svgPoint(e){
  const svg=document.querySelector('svg.field'),pt=svg.createSVGPoint(),src=e.touches?e.touches[0]:e;
  pt.x=src.clientX;pt.y=src.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function initDrag(){
  const svg=document.querySelector('svg.field');
  svg.addEventListener('pointermove',e=>{
    if(!dragKey)return; e.preventDefault();
    const pt=svgPoint(e),pos=JSON.parse(JSON.stringify(livePos||getFullPos(currentZone,currentBall)));
    const nx=Math.max(12,Math.min(288,pt.x-dragOffset.x)),ny=Math.max(12,Math.min(408,pt.y-dragOffset.y));
    if(dragKey==='ball') pos.ball={x:nx,y:ny}; else pos[dragKey]={x:nx,y:ny};
    applyPos(pos);
  },{passive:false});
  svg.addEventListener('pointerup',()=>dragKey=null);
  svg.addEventListener('pointercancel',()=>dragKey=null);
  document.querySelectorAll('[data-drag]').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
      e.preventDefault(); svg.setPointerCapture(e.pointerId);
      dragKey=e.currentTarget.dataset.drag;
      const pt=svgPoint(e),cur=livePos||getFullPos(currentZone,currentBall);
      const ref=dragKey==='ball'?cur.ball:cur[dragKey];
      dragOffset={x:pt.x-ref.x,y:pt.y-ref.y};
    },{passive:false});
  });
}

// ── OVERLAYS ───────────────────────────────────
function toggleOverlay(id, on) { document.getElementById(id).setAttribute('display', on?'':'none'); }

// ── INIT ───────────────────────────────────────
applyPos(getFullPos('defensive','right'));
renderLegend(); updateDescription(); initDrag();
</script>
